<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ampel KI Assistent</title>
  <link rel="manifest" href="./manifest.json">
  <!-- Roboflow JS SDK einbinden -->
  <script src="https://cdn.roboflow.com/0.2.26/roboflow.js"></script>

  <style>
    body {
      margin: 0; padding: 0; background-color: #121212; color: white;
      font-family: sans-serif; display: flex; flex-direction: column;
      height: 100vh; overflow: hidden;
    }
    #status-banner {
      flex: 0 0 25%; display: flex; align-items: center; justify-content: center;
      font-size: 2.8rem; font-weight: bold; text-transform: uppercase;
      background-color: #333; color: white; transition: background-color 0.3s;
      text-align: center; padding: 20px; box-sizing: border-box;
    }
    .status-red { background-color: #d32f2f !important; }
    .status-green { background-color: #388e3c !important; }
    #video-container {
      flex: 1; position: relative; width: 100%; overflow: hidden; background: #000;
    }
    video, canvas {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover;
    }
    #controls {
      flex: 0 0 15%; display: flex; justify-content: center; align-items: center; background: #222;
    }
    button {
      background: #1976d2; color: white; border: none; padding: 20px 40px;
      font-size: 1.5rem; border-radius: 10px; cursor: pointer; width: 80%; font-weight: bold;
    }
  </style>
</head>
<body>

  <div id="status-banner">Lade Modell...</div>
  
  <div id="video-container">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>
  </div>

  <div id="controls">
    <button id="startBtn" disabled>Modell wird geladen...</button>
  </div>

  <script>
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('overlay');
    const ctx = canvas.getContext('2d');
    const banner = document.getElementById('status-banner');
    const startBtn = document.getElementById('startBtn');
    
    let model = null;
    let isRunning = false;
    let lastState = "suche";
    let stateCounter = 0;

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }

    // Roboflow-Ampelmodell laden
    function loadModel() {
      roboflow
        .auth({ client_token: "rf_public" })
        .load({ model: "pedestrian-traffic-light-puf4a", version: 3 })
        .then(function(loadedModel) {
          model = loadedModel;
          startBtn.innerText = "Kamera starten";
          startBtn.disabled = false;
          banner.innerText = "Bereit";
        })
        .catch(function(err) {
          banner.innerText = "Modell-Fehler";
          console.error("Fehler beim Laden des Roboflow-Modells:", err);
        });
    }

    async function startCamera() {
      const constraints = {
        video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } },
        audio: false
      };

      try {
        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = stream;
        await video.play();
        
        canvas.width = video.videoWidth || 640;
        canvas.height = video.videoHeight || 480;

        isRunning = true;
        startBtn.style.display = "none";
        detectLoop();
      } catch (err) {
        alert("Kamerazugriff fehlgeschlagen: " + err.message);
      }
    }

    async function detectLoop() {
      if (!isRunning || !model) return;

      model.detect(video).then(function(predictions) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        let currentState = "suche";

        if (predictions && predictions.length > 0) {
          // Nur Treffer mit mehr als 30% Sicherheit berücksichtigen
          const validHits = predictions.filter(p => p.confidence > 0.3);

          if (validHits.length > 0) {
            const bestHit = validHits.reduce((max, p) => p.confidence > max.confidence ? p : max, validHits[0]);
            
            const w = bestHit.bbox.width;
            const h = bestHit.bbox.height;
            const x = bestHit.bbox.x - w / 2;
            const y = bestHit.bbox.y - h / 2;
            const classLabel = bestHit.class.toLowerCase();

            ctx.strokeStyle = classLabel.includes('green') ? '#4CAF50' : '#F44336';
            ctx.lineWidth = 6;
            ctx.strokeRect(x, y, w, h);
            ctx.fillStyle = ctx.strokeStyle;
            ctx.font = 'bold 22px sans-serif';
            ctx.fillText(`${classLabel.toUpperCase()} (${Math.round(bestHit.confidence * 100)}%)`, x, y > 25 ? y - 8 : 25);

            if (classLabel.includes('green')) currentState = "grün";
            if (classLabel.includes('red')) currentState = "rot";
          }
        }

        updateStatus(currentState);
        requestAnimationFrame(detectLoop);
      });
    }

    function updateStatus(newState) {
      if (newState === lastState) {
        stateCounter++;
      } else {
        stateCounter = 0;
        lastState = newState;
      }

      if (stateCounter === 3) {
        if (newState === "suche") {
          banner.innerText = "Suche Ampel...";
          banner.className = "";
        } else if (newState === "rot") {
          banner.innerText = "ROT";
          banner.className = "status-red";
          speak("Rot");
        } else if (newState === "grün") {
          banner.innerText = "GRÜN";
          banner.className = "status-green";
          speak("Grün");
          if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
        }
      }
    }

    function speak(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'de-DE';
      utterance.rate = 1.2;
      window.speechSynthesis.speak(utterance);
    }

    startBtn.addEventListener('click', startCamera);
    loadModel();
  </script>
</body>
</html>
